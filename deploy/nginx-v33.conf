# Parallel-monitoring routing for the cutover (Fase 5): everything under
# /v33/ goes to the Rust API with the prefix stripped, the rest keeps
# hitting the Node service. Include inside the existing `server` block.
#
#   python3 scripts/parity_check.py --v33 https://sorametrics.org/v33
#
# Full-storage scans (/pools, /holders, /pool/providers) answer 503 with
# Retry-After while a scan runs; the 120 s proxy timeout matches the API's
# own scan budget.

location /v33/socket.io/ {
    proxy_pass http://127.0.0.1:3311/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
}

location /v33/ {
    rewrite ^/v33/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3311;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
}

# Cutover: once parity holds, replace the Node upstream with
# `proxy_pass http://127.0.0.1:3311;` in the root `location /` (and the
# `/socket.io/` block) and retire the /v33/ prefix. The API serves the
# SPA files itself (`STATIC_DIR`), the media (`MUSIC_DIR`, `NEWS_DIR`),
# compression and the security headers, so nginx needs no static root.
