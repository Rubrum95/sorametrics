# Test site for v33 next to production: v33.sorametrics.org -> the same API
# as the final sorametrics.org block. Temporary (tester weeks before cutover).
# Not indexed: it is a duplicate of the production site.
# Certificate: certbot certonly --webroot -w /usr/share/nginx/html -d v33.sorametrics.org

server {
    listen 80;
    listen [::]:80;
    server_name v33.sorametrics.org;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name v33.sorametrics.org;

    ssl_certificate     /etc/letsencrypt/live/v33.sorametrics.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v33.sorametrics.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3311/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3311;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
