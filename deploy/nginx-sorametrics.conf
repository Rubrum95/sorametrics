# /etc/nginx/conf.d/sorametrics.conf on Rubrum-01 — the final routing after
# the cutover: everything to the v33 API (it serves the SPA files, media,
# compression and the security headers itself). Certificates: copy
# /etc/letsencrypt from the old VPS or issue new ones once DNS points here.

server {
    listen 80;
    listen [::]:80;
    server_name sorametrics.org www.sorametrics.org;
    # Let's Encrypt HTTP-01 (certbot --webroot), as the v33 test host does.
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sorametrics.org www.sorametrics.org;

    ssl_certificate     /etc/letsencrypt/live/sorametrics.org-rubrum/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sorametrics.org-rubrum/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3311/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3311;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Full-storage scans answer 503 + Retry-After past their own budget.
        proxy_read_timeout 120s;
    }
}
